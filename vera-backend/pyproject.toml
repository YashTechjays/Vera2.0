[project]
name = "vera-backend"
version = "0.1.0"
description = "Vera 2.0 — HIPAA-compliant multi-tenant voice-AI backend (monorepo root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "mypy>=1.14",
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "pre-commit>=4.6",
    "fakeredis>=2.26",
    "qrcode>=7.4",
    "types-openpyxl",
    # PEP 440 comparison in tests/unit/test_dependency_floors.py (arrives via pytest anyway)
    "packaging>=24",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "RUF",   # ruff-specific
    "ASYNC", # async pitfalls
]

[tool.ruff.lint.flake8-bugbear]
# require()/require_scope() return a fastapi.Depends — safe in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "control_plane.auth.rbac.require",
    "control_plane.auth.api_key.require_scope",
]

[tool.ruff.lint.isort]
known-first-party = ["vera_core", "control_plane", "agent_worker"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]  # nested `with` reads better in test arrange blocks
"apps/agent_worker/src/agent_worker/prompt.py" = ["E501"]  # verbatim prompt strings exceed line limit by design
"apps/agent_worker/src/agent_worker/ivr_prompt.py" = ["E501"]  # verbatim prompt strings exceed line limit by design
"packages/vera_core/src/vera_core/forms/catalog/*.py" = ["E501"]  # verbatim spoken asks exceed line limit by design

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
files = [
    "packages/vera_core/src",
    "apps/control_plane/src",
    "apps/agent_worker/src",
    "tests",
]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests", "apps/agent_worker/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# `evals` are opt-in: they call a live LLM (cost, and LLM-graded runs flake), so the CI
# gate never collects them. Run explicitly: VERA_EVALS_ENABLED=1 pytest -m evals
addopts = "-q -m 'not evals'"
markers = [
    "evals: behavioural evals that call a live LLM (see apps/agent_worker/tests/evals)",
    "integration: needs local Postgres/Redis (`just up`)",
]
