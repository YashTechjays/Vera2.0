[alembic]
script_location = migrations
# Revision IDs are alembic's default random hex (NOT manual sequential 0001/0002…), so
# concurrent branches become separate heads (merge with `just merge-heads`) instead of
# colliding on "the next number". The date+time filename prefix keeps the versions/
# directory in chronological order despite the non-sequential IDs.
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# sqlalchemy.url is set at runtime in migrations/env.py from vera_core settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
