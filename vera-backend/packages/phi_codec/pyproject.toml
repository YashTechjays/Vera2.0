# VENDORED from git@github-work.com:tapu-sutradhar-techjays/phi-codec-vault.git
# at commit 37c38d2 (2026-06-10). That repo remains the upstream for codec
# development; sync changes here deliberately. Monorepo-local edits: the
# en_core_web_sm model wheel is pinned as a direct dependency (uv venvs have no
# pip, so `spacy download` is not available).

[project]
name = "phi-codec"
version = "0.1.0"
description = "Bidirectional PHI de-identification / re-identification codec for a real-time voice AI agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "en-core-web-sm",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=43",
    "python-dateutil>=2.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "jellyfish>=1.0",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2.13"]
redis = ["redis>=5.0"]
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phi_codec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
