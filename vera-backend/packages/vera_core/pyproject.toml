[project]
name = "vera-core"
version = "0.1.0"
description = "Shared core: config, db, models, PHI boundary, schemas, audit, observability"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31",
    "uuid-utils>=0.16",
    # floor 1.39: livekit-agents 1.5.x pins opentelemetry-sdk <1.40
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
    "redis>=5.2",
    "cryptography>=50",
    # IANA tz data for zoneinfo on platforms without a system database (Windows);
    # queue_dispatcher pins its business-hours window to America/New_York.
    "tzdata>=2025.1",
    # Fault-tolerant out-of-pipeline LLM calls (vera_core.llm.ResilientLLM) wrap
    # livekit-agents' FallbackAdapter; google = Vertex Gemini, openai = GPT fallback.
    "livekit-agents[google,openai]>=1.5.17",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_core"]
