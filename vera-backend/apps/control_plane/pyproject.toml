[project]
name = "control-plane"
version = "0.1.0"
description = "Vera control plane — FastAPI API server; owns Postgres and business logic"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.49",
    "alembic>=1.18",
    "google-auth>=2.35",
    "requests>=2.32",
    "redis>=5.2",
    "bcrypt>=4.2",
    "google-cloud-kms>=2.21",
    "google-cloud-storage>=2.18",
    "pyotp>=2.9",
    "aiosmtplib>=3.0",
    "livekit-api>=1.0",
    "email-validator>=2.0",
    "vera-core",
]

[tool.uv.sources]
vera-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
