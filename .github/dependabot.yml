# Keeps the SHA-pinned GitHub Actions fresh: without this, pinning would freeze us on old
# (potentially vulnerable) action versions. Dependabot opens a grouped PR that bumps each
# action's pinned SHA when a new release lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"] # one grouped PR for all action bumps
