# Frontend — build + auto-deploy to the dev VM on push to `dev`.
# Build and deploy are separate reusable pipelines, chained here.

name: frontend-dev

on:
  push:
    branches: [dev]
    paths:
      - "vera-frontend/**"
      - ".github/workflows/frontend-dev.yml"
      - ".github/workflows/_ci-frontend.yml"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/_deploy-vm.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci-frontend.yml

  # Fail-closed before building: the frontend's required BUILD vars must be present & non-empty
  # (they're baked into the bundle). See deploy/env-manifest.json (frontend.buildRequired).
  verify-env:
    runs-on: ubuntu-latest
    permissions:
      contents: read # only checks out + runs a script; no id-token needed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: bash deploy/verify-frontend-build-env.sh
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_VITE_API_BASE_URL }}

  build:
    needs: [ci, verify-env]
    uses: ./.github/workflows/_build-image.yml
    with:
      environment: test
      component: frontend
      context: vera-frontend
      dockerfile: vera-frontend/Dockerfile
      gcp_project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      gcp_region: ${{ vars.DEV_GCP_REGION }}
      ar_repo: ${{ vars.DEV_AR_REPO }}
      # Baked into the bundle. Same-origin path (`/api/v1`); the LB path-routes
      # /api/* to the control-plane, so no CORS.
      build-args: |
        VITE_API_BASE_URL=${{ vars.DEV_VITE_API_BASE_URL }}
    secrets:
      wif_provider: ${{ secrets.DEV_WIF_PROVIDER }}
      deployer_sa: ${{ secrets.DEV_DEPLOYER_SA }}

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-vm.yml
    with:
      environment: test
      service: frontend
      tag_var: FRONTEND_TAG
      image_sha: ${{ github.sha }}
      gcp_project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      gcp_region: ${{ vars.DEV_GCP_REGION }}
      ar_repo: ${{ vars.DEV_AR_REPO }}
      secret_prefix: ${{ vars.DEV_SECRET_PREFIX }}
      vm_name: ${{ vars.DEV_VM_NAME }}
      vm_zone: ${{ vars.DEV_VM_ZONE }}
    secrets:
      wif_provider: ${{ secrets.DEV_WIF_PROVIDER }}
      deployer_sa: ${{ secrets.DEV_DEPLOYER_SA }}
