# Control plane — build + auto-deploy to the dev VM on push to `dev`.
# The deploy runs `alembic upgrade head` before restarting the service.

name: control-plane-dev

on:
  push:
    branches: [dev]
    paths:
      - "vera-backend/apps/control_plane/**"
      - "vera-backend/packages/**"
      - "vera-backend/docker/control_plane.Dockerfile"
      - "vera-backend/pyproject.toml"
      - "vera-backend/uv.lock"
      - ".github/workflows/control-plane-dev.yml"
      - ".github/workflows/_ci-backend.yml"
      - ".github/workflows/_build-image.yml"
      - ".github/workflows/_deploy-vm.yml"
  workflow_dispatch: # manual "Run workflow" trigger (full pipeline, no path filter)

permissions:
  contents: read
  id-token: write

concurrency:
  group: control-plane-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci-backend.yml

  # Fail-closed before building: every env var the control-plane requires must be supplied by
  # the pipeline (mapped in deploy/secrets.map or a render-env built-in). See deploy/env-manifest.json.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read # only checks out + runs a script; no id-token needed
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: bash deploy/verify-config.sh control-plane

  build:
    needs: [ci, verify]
    uses: ./.github/workflows/_build-image.yml
    with:
      environment: test
      component: control-plane
      context: vera-backend
      dockerfile: vera-backend/docker/control_plane.Dockerfile
      gcp_project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      gcp_region: ${{ vars.DEV_GCP_REGION }}
      ar_repo: ${{ vars.DEV_AR_REPO }}
    secrets:
      wif_provider: ${{ secrets.DEV_WIF_PROVIDER }}
      deployer_sa: ${{ secrets.DEV_DEPLOYER_SA }}

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-vm.yml
    with:
      environment: test
      service: control-plane
      tag_var: CONTROL_PLANE_TAG
      image_sha: ${{ github.sha }}
      run_migrations: true
      gcp_project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      gcp_region: ${{ vars.DEV_GCP_REGION }}
      ar_repo: ${{ vars.DEV_AR_REPO }}
      secret_prefix: ${{ vars.DEV_SECRET_PREFIX }}
      vm_name: ${{ vars.DEV_VM_NAME }}
      vm_zone: ${{ vars.DEV_VM_ZONE }}
    secrets:
      wif_provider: ${{ secrets.DEV_WIF_PROVIDER }}
      deployer_sa: ${{ secrets.DEV_DEPLOYER_SA }}
