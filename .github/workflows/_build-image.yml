# Reusable: build one component image and push it to Artifact Registry.
#
# Keyless auth via Workload Identity Federation (no SA JSON key). The image is
# tagged with the immutable commit SHA (what deploys pin) plus a moving `dev`
# tag. Called by the per-component *-dev.yml pipelines, which pass the branch's
# config IN explicitly (repo-level <BRANCH>_* vars/secrets — GitHub Environments
# need a paid plan on private repos, so config can't be environment-scoped).

on:
  workflow_call:
    inputs:
      environment:
        description: Environment label (e.g. test) — labeling only; config is passed in below.
        required: true
        type: string
      component:
        description: Image name under the AR repo (e.g. control-plane)
        required: true
        type: string
      context:
        description: Docker build context directory
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        required: true
        type: string
      build-args:
        description: Newline-separated docker build args
        required: false
        type: string
        default: ""
      gcp_project_id:
        description: GCP project id
        required: true
        type: string
      gcp_region:
        description: GCP region (e.g. us-central1)
        required: true
        type: string
      ar_repo:
        description: Artifact Registry repo name
        required: true
        type: string
    secrets:
      wif_provider:
        description: Workload Identity Federation provider resource
        required: true
      deployer_sa:
        description: Deployer service account email to impersonate
        required: true
    outputs:
      image:
        description: Fully-qualified image pushed (without tag)
        value: ${{ jobs.build.outputs.image }}

# A newer push supersedes an in-flight build of the same image + ref, so a burst of pushes
# doesn't stack N parallel builds. Safe to cancel: the image manifest is pushed last, so a
# cancelled build never yields a deployable tag. Keyed by `inputs.component` so each image
# (control-plane / agent-worker / frontend) is its own group. Deploy is the one stage we
# never cancel — see _deploy-vm.yml.
concurrency:
  group: build-${{ inputs.component }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Config is passed in by the caller (branch-prefixed repo vars/secrets).
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The frontend's Docker build context is vera-frontend/ only, but its source
      # imports the backend's schema JSON straight from the sibling vera-backend/
      # (single source of truth, no bundled copy — see vera-frontend/Dockerfile).
      # Stage a copy inside the build context so that import resolves.
      - name: Stage backend schema for the frontend Docker build
        if: inputs.component == 'frontend'
        working-directory: vera-frontend
        run: ./scripts/stage-backend-schema-for-docker.sh

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.wif_provider }}
          service_account: ${{ secrets.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.gcp_region }}-docker.pkg.dev --quiet

      - id: meta
        name: Resolve image path
        run: |
          echo "image=${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/${{ inputs.ar_repo }}/${{ inputs.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: ${{ inputs.build-args }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the just-built image; fail the build (and thus block deploy) on serious, FIXABLE
      # vulnerabilities. `ignore-unfixed` keeps it actionable — no noise from base CVEs with no
      # upstream fix. Trivy pulls the pushed image from AR via the gcloud docker cred helper
      # configured above.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore # reviewed, accepted CVEs (with justification); nothing else is skipped
