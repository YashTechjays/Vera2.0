# Reusable backend CI gate. Called by `ci.yml` (PRs + main) and, on `dev`, as the
# first job of the backend component pipelines so build only starts if CI is green.

name: _ci-backend

on:
  workflow_call:

# A newer push supersedes an in-flight CI run for the same caller pipeline + ref, so a
# burst of pushes doesn't stack N parallel runs. Safe to cancel: CI has no durable side
# effects (ephemeral service DB, no image pushed). `github.workflow` is the caller
# pipeline, so control-plane and worker CI stay in separate groups (both still run on a
# shared-core push). Deploy is the one stage we never cancel — see _deploy-vm.yml.
concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads code. Declared here too so a caller that has id-token:write
# (the component pipelines) can't leak the deploy token into this reusable CI job.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vera-backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera
          POSTGRES_DB: vera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d vera"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Sync workspace (locked)
        run: uv sync --all-packages --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Migrate + seed (also exercises migration 0001 itself)
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed.py

      - name: Test
        # The vendored latency benchmark asserts a wall-clock p95 budget;
        # shared runners make it meaningless/flaky. It still runs locally.
        run: >-
          uv run pytest
          --deselect packages/phi_codec/tests/test_recall.py::test_latency_budget_regex_path
