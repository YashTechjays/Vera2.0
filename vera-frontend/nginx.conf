# SPA server for the Vera frontend.
#
# Serves the static Vite build with client-side-routing fallback, and
# reverse-proxies /api/* to the control-plane container so the browser sees a
# single origin — VITE_API_BASE_URL stays "/api/v1" with no CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. The strict per-route CSP is owned by the app; this is
    # a floor. No PHI is ever served from this static tier.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed, immutable Vite assets — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API traffic is reverse-proxied to the control-plane container so the browser
    # stays same-origin (VITE_API_BASE_URL="/api/v1", no CORS). "control-plane" is
    # the compose service name; resolving via Docker's embedded DNS at request time
    # keeps a control-plane restart (new container IP) from stranding a stale upstream.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://control-plane:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PHI floor: never cache API responses at the static tier.
        add_header Cache-Control "no-store" always;
    }

    # SPA entry: never cache the HTML shell so new deploys are picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
