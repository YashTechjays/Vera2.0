# SPA server for the Vera frontend.
#
# Serves the static Vite build with client-side-routing fallback. It does NOT
# proxy /api: the load balancer does path-based routing (/api/* → control-plane,
# /* → here), so the browser still sees a single origin and VITE_API_BASE_URL
# stays "/api/v1" with no CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. The strict per-route CSP is owned by the app; this is
    # a floor. No PHI is ever served from this static tier.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed, immutable Vite assets — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA entry: never cache the HTML shell so new deploys are picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
